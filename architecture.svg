<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4E5058"/>
    </marker>
    <marker id="arrowBlurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5865F2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#23272A">System Architecture</text>

  <!-- Client -->
  <rect x="390" y="60" width="180" height="60" rx="12" fill="#23272A"/>
  <text x="480" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Client</text>
  <text x="480" y="104" text-anchor="middle" font-size="11" fill="#B9BBBE">Next.js + shadcn/ui</text>

  <!-- Clerk -->
  <rect x="60" y="170" width="170" height="60" rx="12" fill="#5865F2"/>
  <text x="145" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Clerk</text>
  <text x="145" y="214" text-anchor="middle" font-size="11" fill="#E3E5F2">Authentication</text>

  <!-- Vercel -->
  <rect x="290" y="170" width="180" height="60" rx="12" fill="#111111"/>
  <text x="380" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Vercel</text>
  <text x="380" y="214" text-anchor="middle" font-size="11" fill="#B9BBBE">Next.js app + API routes</text>

  <!-- Socket.io server -->
  <rect x="510" y="170" width="200" height="60" rx="12" fill="#2F3136"/>
  <text x="610" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Socket.io Server</text>
  <text x="610" y="214" text-anchor="middle" font-size="11" fill="#B9BBBE">Railway (persistent process)</text>

  <!-- UploadThing -->
  <rect x="750" y="170" width="170" height="60" rx="12" fill="#5865F2"/>
  <text x="835" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">UploadThing</text>
  <text x="835" y="214" text-anchor="middle" font-size="11" fill="#E3E5F2">File / image storage</text>

  <!-- Prisma -->
  <rect x="390" y="300" width="180" height="60" rx="12" fill="#2D3748"/>
  <text x="480" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Prisma ORM</text>
  <text x="480" y="344" text-anchor="middle" font-size="11" fill="#B9BBBE">Type-safe queries</text>

  <!-- MySQL -->
  <rect x="390" y="420" width="180" height="60" rx="12" fill="#4479A1"/>
  <text x="480" y="445" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">MySQL</text>
  <text x="480" y="464" text-anchor="middle" font-size="11" fill="#E1EBF2">TiDB Cloud (Serverless)</text>

  <!-- Legend -->
  <rect x="40" y="520" width="880" height="70" rx="10" fill="#F2F3F5"/>
  <circle cx="65" cy="545" r="6" fill="#4E5058"/>
  <text x="80" y="550" font-size="11" fill="#23272A">HTTP request / response</text>
  <circle cx="65" cy="570" r="6" fill="#5865F2"/>
  <text x="80" y="575" font-size="11" fill="#23272A">Persistent WebSocket connection</text>
  <text x="500" y="550" font-size="11" fill="#4E5058">Data flow: Client → Vercel/Socket server → Prisma → MySQL</text>
  <text x="500" y="575" font-size="11" fill="#4E5058">Auth flow: Client ↔ Clerk (session verified on every request)</text>

  <!-- Arrows: Client to Clerk -->
  <path d="M 420 120 L 200 170" stroke="#4E5058" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- Client to Vercel -->
  <path d="M 460 120 L 400 170" stroke="#4E5058" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- Client to Socket.io (bidirectional, blurple = websocket) -->
  <path d="M 520 120 L 600 170" stroke="#5865F2" stroke-width="2" fill="none" marker-end="url(#arrowBlurple)" marker-start="url(#arrowBlurple)"/>
  <!-- Client to UploadThing -->
  <path d="M 560 120 L 820 170" stroke="#4E5058" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- Vercel to Prisma -->
  <path d="M 400 230 L 460 300" stroke="#4E5058" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- Socket.io to Prisma -->
  <path d="M 590 230 L 510 300" stroke="#4E5058" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- Prisma to MySQL -->
  <path d="M 480 360 L 480 420" stroke="#4E5058" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
</svg>
